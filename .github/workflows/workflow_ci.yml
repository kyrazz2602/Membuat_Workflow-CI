name: CI/CD Workflow - Train & Publish Model

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==3.12.0 scikit-learn==1.4.2 pandas numpy==1.26.4 psutil==7.2.2 scipy==1.17.1 cloudpickle==3.1.2

      # 4. Run the MLflow Project
      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: file://${{ github.workspace }}/MLProject/mlruns
        run: |
          mlflow run MLProject --env-manager local

      # 5. Build Docker Image using mlflow
      - name: Build Docker Image
        run: |
          MODEL_URI=$(cat latest_model_uri.txt)
          echo "Building Docker image for model at: $MODEL_URI"
          mlflow models build-docker -m "$MODEL_URI" -n kyrazz2602/workflow-ci:latest

      # 6. Log in to Docker Hub (only runs if secrets are present)
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Push Docker Image to Docker Hub (only runs if secrets are present)
      - name: Push Docker Image to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker push kyrazz2602/workflow-ci:latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Commit and Push MLflow runs & model artifacts back to the repository
      - name: Commit and push MLflow runs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/mlruns/
          git diff --staged --quiet || git commit -m "chore: update MLflow tracking runs and artifacts [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. Upload Artifacts to Actions Run (alternative storage)
      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: MLProject/mlruns/
